[package]
name = "campfire"
version = "0.1.0"
edition = "2024"
description = "A small native desktop app for running and managing local dev servers"
license = "MIT"

[dependencies]
command-group = "5.0.1"
# Handle SIGTERM/SIGINT/SIGHUP (and the Windows console close) so we can stop
# managed server groups before exiting; the `termination` feature adds the
# non-SIGINT signals. The handler runs on ctrlc's own thread, so it may lock.
ctrlc = { version = "3.4", features = ["termination"] }
directories = "6.0.0"
dotenvy = "0.15.7"
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["svg"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order keeps package.json scripts in declaration order (dev/build/...)
# rather than alphabetical; indexmap it pulls in is already in the tree via egui.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sysinfo = "0.39.5"
thiserror = "2.0.18"
toml = "1.1.2"
uuid = { version = "1.23.4", features = ["v4"] }

# killpg / kill(pid, 0): signal a whole process group, and probe liveness, by
# PID alone — needed to reap an orphaned group whose GroupChild handle died with
# a previous app instance. Already in the tree transitively (via command-group).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Size-optimized release build (goal: small binary). Unwinding is kept (no
# panic="abort") so RunningProcess::Drop still kills child processes on a panic.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
