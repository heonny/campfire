[package]
name = "campfire"
version = "0.1.0"
edition = "2024"
description = "A small native desktop app for running and managing local dev servers"
license = "MIT"

[dependencies]
command-group = "5.0.1"
directories = "6.0.0"
dotenvy = "0.15.7"
eframe = "0.35.0"
egui = "0.35.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
sysinfo = "0.39.5"
thiserror = "2.0.18"
toml = "1.1.2"
uuid = { version = "1.23.4", features = ["v4"] }

# Size-optimized release build (goal: small binary). Unwinding is kept (no
# panic="abort") so RunningProcess::Drop still kills child processes on a panic.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
